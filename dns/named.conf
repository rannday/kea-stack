options {
  directory "/var/cache/bind";
  pid-file "/var/cache/bind/named.pid";
  session-keyfile "/var/cache/bind/session.key";
  listen-on { any; };
  listen-on-v6 { any; };
  allow-query { any; };
  allow-recursion { none; };
  recursion no;
  dnssec-validation no;
  auth-nxdomain no;
  minimal-responses yes;
  zone-statistics yes;
};

statistics-channels {
  inet 127.0.0.1 port 8053 allow { 127.0.0.1; };
};

include "/var/run/named/kea-ddns.key";

zone "example.com" {
  type primary;
  file "/var/cache/bind/primary/db.example.com";
  allow-update { key "kea-ddns-key"; };
  notify yes;
};

zone "2.0.192.in-addr.arpa" {
  type primary;
  file "/var/cache/bind/primary/db.2.0.192";
  allow-update { key "kea-ddns-key"; };
  notify yes;
};

zone "0.0.0.0.1.0.0.0.8.b.d.0.1.0.0.2.ip6.arpa" {
  type primary;
  file "/var/cache/bind/primary/db.0.0.0.0.1.0.0.0.8.b.d.0.1.0.0.2.ip6.arpa";
  allow-update { key "kea-ddns-key"; };
  notify yes;
};
