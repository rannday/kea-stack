{
  "Dhcp4": {
    "user-context": {
      "setup-note": "IMPORTANT: replace option-data dhcp-server-identifier 192.168.1.10 with the Docker host IPv4 address reachable from clients and relays. Do not use a wildcard or container IP; unicast lease renewal depends on this address."
    },
    "interfaces-config": {
      "interfaces": [ "*" ],
      "dhcp-socket-type": "udp"
    },
    "multi-threading": {
      "enable-multi-threading": true,
      "thread-pool-size": 20,
      "packet-queue-size": 64
    },
    "control-sockets": [
      {
        "socket-type": "http",
        "socket-address": "__KEA_CONTROL_ADDRESS__",
        "socket-port": 8000,
        "authentication": {
          "type": "basic",
          "realm": "server1-dhcp4",
          "directory": "/run/kea",
          "clients": [{ "user-file": "dhcp4-api-user", "password-file": "dhcp4-api-password" }]
        }
      }
    ],
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "__DDNS_ADDRESS__",
      "server-port": 53001,
      "ncr-protocol": "UDP",
      "ncr-format": "JSON"
    },
    "lease-database": {
      "type": "postgresql",
      "name": "__LEASE_DB_NAME__",
      "user": "__LEASE_DB_USER__",
      "password": "__LEASE_DB_PASS__",
      "host": "lease-db",
      "port": 5432
    },
    "hosts-database": {
      "type": "postgresql",
      "name": "__SHARED_DB_NAME__",
      "user": "__SHARED_DB_USER__",
      "password": "__SHARED_DB_PASS__",
      "host": "shared-db",
      "port": 5432
    },
    "hooks-libraries": [
      { "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_pgsql.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_ddns_tuning.so", "parameters": {} },
      { "library": "/usr/lib/kea/hooks/libdhcp_perfmon.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_stat_cmds.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_bootp.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_host_cmds.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_class_cmds.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_limits.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_subnet_cmds.so" },
      {
        "library": "/usr/lib/kea/hooks/libdhcp_legal_log.so",
        "parameters": {
          "type": "postgresql", "name": "__SHARED_DB_NAME__", "user": "__SHARED_DB_USER__",
          "password": "__SHARED_DB_PASS__", "host": "shared-db", "port": 5432
        }
      }
    ],
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "ddns-send-updates": true,
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "dynv4",
    "ddns-qualifying-suffix": "example.com",
    "hostname-char-set": "[^A-Za-z0-9-]",
    "hostname-char-replacement": "-",
    "option-data": [
      { "name": "dhcp-server-identifier", "data": "192.0.2.253" },
      { "name": "domain-name-servers", "data": "192.0.2.53" },
      { "name": "domain-name", "data": "example.com" }
    ],
    "subnet4": [{
      "id": 1,
      "subnet": "192.0.2.0/24",
      "pools": [{ "pool": "192.0.2.100 - 192.0.2.250" }],
      "option-data": [{ "name": "routers", "data": "192.0.2.1" }]
    }],
    "loggers": [{
      "name": "kea-dhcp4",
      "output-options": [{
        "output": "/var/log/kea/dhcp4.log", "maxver": 2, "maxsize": 204800
      }],
      "severity": "INFO"
    }]
  }
}
