name: kea-stack

x-kea-environment: &kea-environment
  DNS_ENABLED: "${COMPOSE_PROFILES:-}"
  DDNS_TSIG_KEY: "${DDNS_TSIG_KEY:-}"
  DHCP4_API_USER: "${DHCP4_API_USER:?Set DHCP4_API_USER}"
  DHCP4_API_PASSWORD: "${DHCP4_API_PASS:?Set DHCP4_API_PASS}"
  DHCP6_API_USER: "${DHCP6_API_USER:?Set DHCP6_API_USER}"
  DHCP6_API_PASSWORD: "${DHCP6_API_PASS:?Set DHCP6_API_PASS}"
  DDNS_API_USER: "${DDNS_API_USER:?Set DDNS_API_USER}"
  DDNS_API_PASSWORD: "${DDNS_API_PASS:?Set DDNS_API_PASS}"
  LEASE_DB_USER: "${LEASE_DB_USER:?Set LEASE_DB_USER}"
  LEASE_DB_PASS: "${LEASE_DB_PASS:?Set LEASE_DB_PASS}"
  LEASE_DB_NAME: "${LEASE_DB_NAME:-kea_leases}"
  SHARED_DB_USER: "${SHARED_DB_USER:?Set SHARED_DB_USER}"
  SHARED_DB_PASS: "${SHARED_DB_PASS:?Set SHARED_DB_PASS}"
  SHARED_DB_NAME: "${SHARED_DB_NAME:?Set SHARED_DB_NAME}"

services:
  dns:
    profiles: ["dns"]
    environment:
      DDNS_TSIG_KEY: "${DDNS_TSIG_KEY:-}"
    image: internetsystemsconsortium/bind9:9.20
    entrypoint: ["sh", "/config/entrypoint.sh"]
    restart: unless-stopped
    volumes:
      - ./dns/entrypoint.sh:/config/entrypoint.sh:ro
      - ./dns/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - dns:/var/cache/bind
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/zones:/usr/local/share/kea/zone-seeds:ro
    ports:
      - "[${BIND9_BIND_ADDRESS:-0.0.0.0}]:${BIND9_BIND_PORT:-53}:53/udp"
      - "[${BIND9_BIND_ADDRESS:-0.0.0.0}]:${BIND9_BIND_PORT:-53}:53/tcp"
    networks: [net]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shared-db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${SHARED_DB_PASS:?Set SHARED_DB_PASS}"
      APP_DB_USER: "${SHARED_DB_USER:?Set SHARED_DB_USER}"
      APP_DB_PASSWORD: "${SHARED_DB_PASS:?Set SHARED_DB_PASS}"
      APP_DB_NAME: "${SHARED_DB_NAME:?Set SHARED_DB_NAME}"
    volumes:
      - database:/var/lib/postgresql
      - ./shared-db/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  lease-db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${LEASE_DB_PASS:?Set LEASE_DB_PASS}"
      APP_DB_USER: "${LEASE_DB_USER:?Set LEASE_DB_USER}"
      APP_DB_PASSWORD: "${LEASE_DB_PASS:?Set LEASE_DB_PASS}"
      APP_DB_NAME: "${LEASE_DB_NAME:-kea_leases}"
    volumes:
      - dhcp:/var/lib/postgresql
      - ./shared-db/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  stork-db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${STORK_DB_PASS:?Set STORK_DB_PASS}"
      APP_DB_USER: "${STORK_DB_USER:?Set STORK_DB_USER}"
      APP_DB_PASSWORD: "${STORK_DB_PASS:?Set STORK_DB_PASS}"
      APP_DB_NAME: stork
    volumes:
      - stork_db:/var/lib/postgresql
      - ./shared-db/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kea-init:
    image: kea-stack-stork-agent
    pull_policy: build
    build: &stork-agent-build
      context: ./stork
      dockerfile: agent.Dockerfile
    entrypoint: ["sh", "/config/init-schema.sh"]
    volumes:
      - ./kea-init/init-schema.sh:/config/init-schema.sh:ro
      - ./kea-init/kea-schema.sh:/usr/local/bin/kea-schema.sh:ro
    environment: *kea-environment
    depends_on:
      shared-db:
        condition: service_healthy
      lease-db:
        condition: service_healthy
    networks: [net]

  dhcp4:
    image: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.1-20260930
    entrypoint: ["sh", "/config/entrypoint.sh"]
    restart: unless-stopped
    environment:
      <<: *kea-environment
    depends_on:
      kea-init:
        condition: service_completed_successfully
    volumes:
      - ./dhcp4/entrypoint.sh:/config/entrypoint.sh:ro
      - ./dhcp4/render.awk:/config/render.awk:ro
      - ./dhcp4/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ./dhcp4/kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
      - dhcp4_runtime:/run/kea
      - ./.logs/dhcp:/var/log/kea
      - dhcp_state:/var/lib/kea
    networks: [net]
    ports:
      - "[${DHCP4_CTRL_BIND_ADDRESS:-0.0.0.0}]:8100:8000"
      - "[${DHCP4_BIND_ADDRESS:-0.0.0.0}]:67:67/udp"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  dhcp6:
    image: docker.cloudsmith.io/isc/docker/kea-dhcp6:3.2.1-20260930
    entrypoint: ["sh", "/config/entrypoint.sh"]
    restart: unless-stopped
    environment:
      <<: *kea-environment
    depends_on:
      kea-init:
        condition: service_completed_successfully
    volumes:
      - ./dhcp6/entrypoint.sh:/config/entrypoint.sh:ro
      - ./dhcp6/render.awk:/config/render.awk:ro
      - ./dhcp6/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ./dhcp6/kea-dhcp6.conf:/etc/kea/kea-dhcp6.conf:ro
      - dhcp6_runtime:/run/kea
      - ./.logs/dhcp:/var/log/kea
      - dhcp_state:/var/lib/kea
    networks: [net]
    ports:
      - "[${DHCP6_CTRL_BIND_ADDRESS:-0.0.0.0}]:8101:8001"
      - "[${DHCP6_BIND_ADDRESS:-::}]:547:547/udp"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ddns:
    image: docker.cloudsmith.io/isc/docker/kea-dhcp-ddns:3.2.1-20260930
    entrypoint: ["sh", "/config/entrypoint.sh"]
    profiles: ["dns"]
    restart: unless-stopped
    environment:
      <<: *kea-environment
    depends_on:
      kea-init:
        condition: service_completed_successfully
    volumes:
      - ./ddns/entrypoint.sh:/config/entrypoint.sh:ro
      - ./ddns/render.awk:/config/render.awk:ro
      - ./ddns/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ./ddns/kea-dhcp-ddns.conf:/etc/kea/kea-dhcp-ddns.conf:ro
      - ddns_runtime:/run/kea
      - ./.logs/dhcp:/var/log/kea
    networks: [net]
    ports:
      - "[${DDNS_CTRL_BIND_ADDRESS:-0.0.0.0}]:8102:8002"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agent4:
    image: kea-stack-stork-agent
    pull_policy: build
    build: *stork-agent-build
    restart: unless-stopped
    pid: service:dhcp4
    network_mode: service:dhcp4
    environment:
      KEA_SERVICE: dhcp4
    depends_on:
      dhcp4:
        condition: service_healthy
    volumes:
      - dhcp4_runtime:/run/kea:ro
      - agent4_state:/var/lib/stork-agent
      - ./.logs/dhcp:/var/log/kea:ro

  agent6:
    image: kea-stack-stork-agent
    pull_policy: build
    build: *stork-agent-build
    restart: unless-stopped
    pid: service:dhcp6
    network_mode: service:dhcp6
    environment:
      KEA_SERVICE: dhcp6
    depends_on:
      dhcp6:
        condition: service_healthy
    volumes:
      - dhcp6_runtime:/run/kea:ro
      - agent6_state:/var/lib/stork-agent
      - ./.logs/dhcp:/var/log/kea:ro

  agent-ddns:
    image: kea-stack-stork-agent
    pull_policy: build
    build: *stork-agent-build
    profiles: ["dns"]
    restart: unless-stopped
    pid: service:ddns
    network_mode: service:ddns
    environment:
      KEA_SERVICE: ddns
    depends_on:
      ddns:
        condition: service_healthy
    volumes:
      - ddns_runtime:/run/kea:ro
      - agent-ddns_state:/var/lib/stork-agent
      - ./.logs/dhcp:/var/log/kea:ro

  bind-exporter:
    image: prometheuscommunity/bind-exporter:v0.8.0
    profiles: ["dns"]
    restart: unless-stopped
    network_mode: service:dns
    depends_on:
      dns:
        condition: service_healthy

  db-backups:
    image: postgres:18.6-bookworm
    entrypoint: ["sh", "/config/entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      kea-init:
        condition: service_completed_successfully
      shared-db:
        condition: service_healthy
      lease-db:
        condition: service_healthy
      stork:
        condition: service_healthy
    environment:
      SHARED_DB_BACKUP_RETENTION_DAYS: "${SHARED_DB_BACKUP_RETENTION_DAYS:-1}"
      SHARED_DB_BACKUP_INTERVAL_SECONDS: "${SHARED_DB_BACKUP_INTERVAL_SECONDS:-10800}"
      STORK_DB_BACKUP_RETENTION_DAYS: "${STORK_DB_BACKUP_RETENTION_DAYS:-3}"
      STORK_DB_BACKUP_INTERVAL_SECONDS: "${STORK_DB_BACKUP_INTERVAL_SECONDS:-86400}"
      LEASE_DB_NAME: "${LEASE_DB_NAME:-kea_leases}"
      LEASE_DB_USER: "${LEASE_DB_USER:?Set LEASE_DB_USER}"
      LEASE_DB_PASS: "${LEASE_DB_PASS:?Set LEASE_DB_PASS}"
      SHARED_DB_NAME: "${SHARED_DB_NAME:?Set SHARED_DB_NAME}"
      SHARED_DB_USER: "${SHARED_DB_USER:?Set SHARED_DB_USER}"
      SHARED_DB_PASS: "${SHARED_DB_PASS:?Set SHARED_DB_PASS}"
      STORK_DB_NAME: stork
      STORK_DB_USER: "${STORK_DB_USER:?Set STORK_DB_USER}"
      STORK_DB_PASS: "${STORK_DB_PASS:?Set STORK_DB_PASS}"
    volumes:
      - backups:/var/lib/kea-backups
      - ./db-backups/entrypoint.sh:/config/entrypoint.sh:ro
      - ./db-backups/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
    networks: [net]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  stork:
    image: kea-stack-stork
    pull_policy: build
    build:
      context: ./stork
    restart: unless-stopped
    environment:
      STORK_DATABASE_HOST: stork-db
      STORK_DATABASE_PORT: "5432"
      STORK_DATABASE_NAME: stork
      STORK_DATABASE_USER_NAME: "${STORK_DB_USER:?Set STORK_DB_USER}"
      STORK_DATABASE_PASSWORD: "${STORK_DB_PASS:?Set STORK_DB_PASS}"
      STORK_SERVER_ENABLE_METRICS: "true"
    depends_on:
      stork-db:
        condition: service_healthy
    volumes:
      - stork:/var/lib/stork
    networks: [net]
    ports:
      - "[${STORK_BIND_ADDRESS:-0.0.0.0}]:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.15.0
    entrypoint: ["sh", "/config/entrypoint.sh"]
    restart: unless-stopped
    environment:
      DNS_ENABLED: "${COMPOSE_PROFILES:-}"
    volumes:
      - prometheus:/prometheus
      - ./prometheus/entrypoint.sh:/config/entrypoint.sh:ro
      - ./prometheus/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [net]
    ports:
      - "[${PROMETHEUS_BIND_ADDRESS:-0.0.0.0}]:9090:9090"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:13.2.3
    entrypoint: ["sh", "/config/entrypoint.sh"]
    restart: unless-stopped
    environment:
      DNS_ENABLED: "${COMPOSE_PROFILES:-}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASS:?Set GRAFANA_ADMIN_PASS}"
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/entrypoint.sh:/config/entrypoint.sh:ro
      - ./grafana/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/usr/local/share/grafana/dashboards:ro
    networks: [net]
    ports:
      - "[${GRAFANA_BIND_ADDRESS:-0.0.0.0}]:3000:3000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  dns: {}
  database: {}
  dhcp: {}
  dhcp_state: {}
  backups: {}
  stork: {}
  stork_db: {}
  prometheus: {}
  grafana: {}
  dhcp4_runtime: {}
  dhcp6_runtime: {}
  ddns_runtime: {}
  agent4_state: {}
  agent6_state: {}
  agent-ddns_state: {}

networks:
  net:
    driver: bridge
    enable_ipv6: true
