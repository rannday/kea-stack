{
  "Dhcp6": {
    "interfaces-config": { "interfaces": ["*"], "re-detect": false },
    "multi-threading": {
      "enable-multi-threading": true,
      "thread-pool-size": 20,
      "packet-queue-size": 64
    },
    "control-sockets": [{
      "socket-type": "http",
      "socket-address": "__KEA_CONTROL_ADDRESS__",
      "socket-port": 8001,
      "authentication": {
        "type": "basic",
        "realm": "server1-dhcp6",
        "directory": "/run/kea",
        "clients": [{ "user-file": "dhcp6-api-user", "password-file": "dhcp6-api-password" }]
      }
    }],
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "__DDNS_ADDRESS__",
      "server-port": 53001,
      "ncr-protocol": "UDP",
      "ncr-format": "JSON"
    },
    "lease-database": {
      "type": "postgresql", "name": "__LEASE_DB_NAME__", "user": "__LEASE_DB_USER__",
      "password": "__LEASE_DB_PASS__", "host": "lease-db", "port": 5432
    },
    "hosts-database": {
      "type": "postgresql", "name": "__SHARED_DB_NAME__", "user": "__SHARED_DB_USER__",
      "password": "__SHARED_DB_PASS__", "host": "shared-db", "port": 5432
    },
    "hooks-libraries": [
      { "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_pgsql.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_ddns_tuning.so", "parameters": {} },
      { "library": "/usr/lib/kea/hooks/libdhcp_perfmon.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_stat_cmds.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_host_cmds.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_class_cmds.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_limits.so" },
      { "library": "/usr/lib/kea/hooks/libdhcp_subnet_cmds.so" },
      {
        "library": "/usr/lib/kea/hooks/libdhcp_legal_log.so",
        "parameters": {
          "type": "postgresql", "name": "__SHARED_DB_NAME__", "user": "__SHARED_DB_USER__",
          "password": "__SHARED_DB_PASS__", "host": "shared-db", "port": 5432
        }
      }
    ],
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "ddns-send-updates": true,
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "dynv6",
    "ddns-qualifying-suffix": "example.com",
    "hostname-char-set": "[^A-Za-z0-9-]",
    "hostname-char-replacement": "-",
    "option-data": [{
      "name": "dns-servers",
      "data": "2001:db8::53"
    }],
    "subnet6": [{
      "id": 1,
      "subnet": "2001:db8:1::/64",
      "pools": [{
        "pool": "2001:db8:1::1000 - 2001:db8:1::1fff"
      }]
    }],
    "loggers": [{
      "name": "kea-dhcp6",
      "output-options": [{
        "output": "/var/log/kea/dhcp6.log", "maxver": 2, "maxsize": 204800
      }],
      "severity": "INFO"
    }]
  }
}
